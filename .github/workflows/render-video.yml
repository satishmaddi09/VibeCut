name: Render Video

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        # Install system dependencies required for Headless Chrome on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev ffmpeg

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Write Storyboard JSON
        # Save the storyboard configuration payload to a local file using env variable to prevent escaping bugs
        env:
          STORYBOARD_JSON: ${{ toJson(github.event.client_payload.storyboard) }}
        run: |
          node -e "fs.writeFileSync('remotion/storyboard.json', process.env.STORYBOARD_JSON, 'utf8')"
          echo "Storyboard written successfully!"

      - name: Ensure Chromium Browser is Installed
        run: npx remotion browser ensure

      - name: Render Video with Remotion
        run: |
          npx remotion render remotion/index.ts VideoComposition out/video.mp4 --props=remotion/storyboard.json --jpeg-quality=80

      - name: Compress Video with FFmpeg
        run: |
          echo "Original size: $(du -sh out/video.mp4 | cut -f1)"
          ffmpeg -i out/video.mp4 \
            -vcodec libx264 \
            -crf 18 \
            -preset medium \
            -acodec aac \
            -b:a 128k \
            -movflags +faststart \
            out/video_compressed.mp4
          echo "Compressed size: $(du -sh out/video_compressed.mp4 | cut -f1)"
          mv out/video_compressed.mp4 out/video.mp4

      - name: Upload Video to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENERATION_ID: ${{ github.event.client_payload.generationId }}
          FILE_PATH: out/video.mp4
        run: node scripts/upload-to-supabase.js

      - name: Clean up Supabase on Failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENERATION_ID: ${{ github.event.client_payload.generationId }}
        run: node scripts/cleanup-on-failure.js

